<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Реалистичные люди — проба</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #20262a;
        --ink: #e9ecee;
        --dim: #9aa6ad;
        --card: #f3f1ec;
        --card-ink: #2a2f33;
        --accent: #6fa8d6;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 system-ui, 'Segoe UI', sans-serif; }
      #app { min-height: 100%; }
      .row { display: flex; gap: 0; }
      .panel { position: relative; }
      .panel canvas { display: block; }
      .tag { position: absolute; left: 12px; top: 10px; padding: 4px 9px; border-radius: 6px; background: rgba(20, 26, 30, 0.72); font-size: 13px; }
      .label { position: absolute; transform: translate(-50%, 0); padding: 1px 6px; border-radius: 4px; background: rgba(20, 26, 30, 0.7); font-size: 12px; white-space: nowrap; pointer-events: none; }
      .cards { display: flex; gap: 18px; padding: 18px; align-items: flex-start; }
      .card { width: 360px; border-radius: 10px; overflow: hidden; background: var(--card); color: var(--card-ink); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
      .card canvas { display: block; width: 360px; height: 440px; }
      .card .cap { padding: 8px 12px 10px; font-size: 13px; border-top: 1px solid #d9d4ca; }
      .card .cap b { display: block; font-size: 15px; }
      .card .cap span { color: #6b7378; }
      .editor { display: flex; gap: 18px; padding: 18px; align-items: flex-start; }
      .sliders { width: 300px; padding: 14px 16px; border-radius: 10px; background: #2b3237; }
      .sliders h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
      .sliders label { display: block; margin: 7px 0 1px; color: var(--dim); font-size: 13px; }
      .sliders label output { float: right; color: var(--ink); }
      .sliders input[type='range'] { width: 100%; accent-color: var(--accent); }
      .sliders .note { margin-top: 12px; color: var(--dim); font-size: 12px; }
      .menu { padding: 24px; }
      .menu a { color: var(--accent); display: block; margin: 6px 0; }
      .err { padding: 24px; color: #ff9a8a; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="dist/app.js"></script>
  </body>
</html>
