<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:">
  <link rel="icon" href="data:,">
  <title>Больница — проба 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #b9cdd9; font: 13px/1.4 system-ui, sans-serif; color: #1c2b2d; overflow: hidden; }
    #view { position: absolute; inset: 0; touch-action: none; }
    #panel { position: absolute; left: 8px; top: 8px; right: 8px; pointer-events: none; }
    #bar { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .lbl { margin-left: 8px; color: #1c2b2d; background: rgba(255,255,255,.7); padding: 2px 6px; border-radius: 4px; }
    .lbl input { vertical-align: middle; width: 110px; }
    button { font: inherit; padding: 4px 10px; border: 1px solid #5e6f72; background: #fff; border-radius: 4px; cursor: pointer; }
    button.on { background: #1c2b2d; color: #fff; }
    #hud, #status { margin-top: 6px; display: inline-block; background: rgba(255,255,255,.88); padding: 4px 8px; border-radius: 4px; white-space: pre-wrap; pointer-events: auto; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="panel">
    <div id="bar"></div>
    <div id="hud">Загрузка…</div><br>
    <div id="status"></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
