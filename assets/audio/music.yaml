# Музыка «Больницы» (docs/specs/2026-11-sound.md, часть 3; геймдизайн §13): спокойная музыка CC0 и CC BY с OpenGameArt.org
# и Free Music Archive, без NC, ND и SA (решение владельца #208, вариант 2). Кандидатов подобрал агент (#214: десять пьес от
# десяти авторов), выбрал владелец 08.11.2026: «Убираем 5 и 8, остальные можно оставить все» — здесь восемь, кроме
# Viewpoint (Serat) и ACOUSTIC MEDITATION (Jason Shaw).
#
# У каждой пьесы: страница `page` — где сказана лицензия; `download` — откуда файл (тот, что на странице; у Free Music
# Archive — файл проигрывателя страницы: кнопка «Download» просит войти), `sha256` — его хеш; у CC BY — `credit`, строка
# атрибуции, как просит страница; `note` — где и когда выложена и что она не из генератора (AGENTS.md: музыка — никогда из
# генераторов). Файл — assets/audio/music/<id>.webm: `npm run music` (tools/sound/music.ts, нужен ffmpeg). Генератор
# пишет и src/app/music.gen.ts, и раздел «Музыка» в assets/audio/LICENSES.md.
