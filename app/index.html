<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:">
  <link rel="icon" href="data:,">
  <title>Bolnitsa</title>
  <style>
    :root {
      --panel: rgba(22, 30, 34, 0.86);
      --panel-2: rgba(36, 48, 54, 0.92);
      --line: rgba(255, 255, 255, 0.14);
      --text: #e9eef0;
      --muted: #9fb0b6;
      --accent: #2fb5c9;
      --red: #d8392b;
      --yellow: #e7b416;
      --green: #4caf6e;
    }
    html, body { margin: 0; height: 100%; background: #2a3236; color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #view { position: absolute; inset: 0; touch-action: none; }
    #ui { position: absolute; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button.on { background: var(--accent); color: #0b1a1e; border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    .top { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 10px; }
    .top .clock { font-size: 16px; font-weight: 600; min-width: 130px; }
    .top .group, .debug .group { display: inline-flex; gap: 4px; }
    .top .stat b { color: #fff; }
    .top .warn { color: var(--yellow); }
    .top .notice { flex: 1 1 0; min-width: 90px; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .viewbar { position: absolute; right: 8px; top: 56px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 5px 8px; max-width: calc(100% - 200px); }
    .label { color: var(--muted); margin: 0 2px 0 8px; }
    .left { position: absolute; left: 8px; top: 56px; width: 150px; display: flex; flex-direction: column; gap: 6px; padding: 8px; }
    .left .hint { color: var(--muted); font-size: 12px; }
    .right { position: absolute; right: 8px; top: 100px; width: 280px; display: flex; flex-direction: column; gap: 6px; }
    .right .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; }
    .right .tabbody { max-height: 50vh; overflow: auto; padding: 6px 8px; }
    .right ul { list-style: none; margin: 0; padding: 0; }
    .right li { margin: 2px 0; }
    .right .row { width: 100%; text-align: left; border-left: 4px solid var(--green); }
    .row.t-red { border-left-color: var(--red); }
    .row.t-yellow { border-left-color: var(--yellow); }
    .card { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; min-width: 360px; max-width: 560px; padding: 8px 12px; }
    .cardhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 15px; }
    .cardhead .close { margin-left: auto; }
    .card dl { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; margin: 0; }
    .card dt { color: var(--muted); font-size: 11px; }
    .card dd { margin: 0 0 4px; }
    .badge { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--green); }
    .badge.t-red { background: var(--red); }
    .badge.t-yellow { background: var(--yellow); }
    .muted { color: var(--muted); }
    .debug { position: absolute; right: 8px; bottom: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
    .status { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 15px; max-width: 70%; text-align: center; }
    /* стройка (docs/specs/2026-10-build.md) */
    .banner { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); padding: 5px 12px; color: var(--yellow); max-width: 40%; text-align: center; }
    .left.wide { top: 100px; width: 270px; max-height: calc(100vh - 108px); overflow: hidden; }
    .left.wide > * { flex-shrink: 0; }
    .left.wide > .list { flex-shrink: 1; min-height: 48px; overflow-y: auto; }
    .left .row { display: flex; gap: 4px; align-items: center; }
    .left .row .close { margin-left: auto; }
    .left .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .left .tools button, .left .row button, .left button.wide { text-align: left; }
    .left .spent b { color: #fff; }
    .left .label { color: var(--muted); margin: 2px 0 0; }
    .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .list button { width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left; }
    .list small { color: var(--muted); white-space: nowrap; }
    .list button.on small { color: #0b1a1e; }
    .ghostline { padding: 4px 6px; border-radius: 4px; background: rgba(0,0,0,.25); }
    .ghostline.ok { color: #8fe3b4; }
    .ghostline.bad { color: #ff9b86; }
    .card .state { font-weight: 600; margin: 2px 0 6px; }
    .card .state.ok { color: #8fe3b4; }
    .card .state.bad { color: #ff9b86; }
    .card .problems { margin: -2px 0 6px; padding-left: 18px; color: #ffc2b5; }
    .card .need { display: inline-block; margin-right: 8px; }
    .card .need.ok { color: #8fe3b4; }
    .card .need.bad { color: #ff9b86; }
    .card .post { display: flex; gap: 6px; align-items: center; margin: 1px 0; }
    .card .row { display: flex; gap: 6px; margin-top: 6px; }
    button.small { padding: 1px 6px; font-size: 12px; }
    .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .rlabel { position: absolute; left: 0; top: 0; padding: 2px 7px; border-radius: 4px; background: rgba(22,30,34,.84); border-left: 3px solid var(--green); font-size: 11px; line-height: 1.25; white-space: nowrap; color: var(--text); }
    .rlabel.bad { border-left-color: var(--red); }
    .rlabel b { display: block; font-size: 12px; }
    .rlabel span { color: var(--muted); }
    .rlabel.bad span { color: #ffb4a6; }
    .start { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; width: 420px; }
    .start h2 { margin: 0 0 4px; font-size: 20px; }
    .start button { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 10px 12px; }
    .start button b { font-size: 15px; }
    .start button span { color: var(--muted); }
    /* люди и поток (docs/specs/2026-10-flow-ui.md): значки помещений, вкладка «Пациенты», путь пациента, слои */
    .chips { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .chip { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 4px; padding: 1px 6px 1px 4px; border-radius: 10px; background: rgba(22,30,34,.82); border: 1px solid rgba(255,255,255,.18); font-size: 11px; line-height: 16px; white-space: nowrap; color: #8fe3b4; }
    .chip svg { flex: none; }
    .chip.t-busy { color: #8fd3ff; }
    .chip.t-queue { color: var(--yellow); border-color: rgba(231,180,22,.55); }
    .chip.t-bad { color: #ff9b86; border-color: rgba(216,57,43,.6); }
    .chip.t-off { color: var(--muted); }
    .chip.t-ask { color: var(--accent); border-color: rgba(47,181,201,.6); }
    .chip.t-ok span { color: var(--muted); }
    .patients .pfilters { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
    .patients .group { display: inline-flex; gap: 3px; flex-wrap: wrap; }
    .patients .pfilters button { padding: 1px 6px; font-size: 12px; }
    .patients .small { font-size: 11px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--green); vertical-align: -1px; }
    .dot.t-red { background: var(--red); }
    .dot.t-yellow { background: var(--yellow); }
    .right .prow { display: flex; flex-direction: column; gap: 1px; padding: 3px 7px; }
    .prow .ptitle { display: flex; align-items: center; gap: 6px; }
    .prow .ptext { color: var(--muted); font-size: 12px; }
    .mood { display: inline-flex; }
    .mood.m-long svg { fill: var(--yellow); }
    .mood.m-unhappy svg { fill: var(--red); }
    .mood.m-ask svg { fill: var(--accent); }
    .card .path { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
    .card .phead { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
    .card .pleft { background: rgba(216,57,43,.16); border-left: 3px solid var(--red); padding: 4px 8px; margin-bottom: 6px; border-radius: 3px; }
    .card .plines { list-style: none; margin: 0; padding: 0; max-height: 34vh; overflow: auto; }
    .card .plines li { display: grid; grid-template-columns: 44px 1fr; gap: 6px; padding: 2px 0; }
    .card .plines .pat { color: var(--muted); font-variant-numeric: tabular-nums; }
    .card .plines .pwhy { display: block; color: var(--muted); font-size: 12px; }
    .card .plines li.pl-wait .ptxt { color: #ffd98a; }
    .card .plines li.pl-end .ptxt { font-weight: 600; }
    .card .plines li.now .pnow { color: var(--accent); }
    .card .psum { margin-top: 4px; font-size: 12px; }
    .layers { display: flex; flex-direction: column; gap: 3px; }
    .layers button { text-align: left; }
    .layers .hint { margin: 2px 0 0; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="ui"></div>
  <script src="./app.js"></script>
</body>
</html>
