<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:">
  <link rel="icon" href="data:,">
  <title>Bolnitsa</title>
  <style>
    :root {
      --panel: rgba(22, 30, 34, 0.86);
      --panel-2: rgba(36, 48, 54, 0.92);
      --line: rgba(255, 255, 255, 0.14);
      --text: #e9eef0;
      --muted: #9fb0b6;
      --accent: #2fb5c9;
      --red: #d8392b;
      --yellow: #e7b416;
      --green: #4caf6e;
    }
    html, body { margin: 0; height: 100%; background: #2a3236; color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #view { position: absolute; inset: 0; touch-action: none; }
    #ui { position: absolute; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button.on { background: var(--accent); color: #0b1a1e; border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    .top { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 10px; }
    .top .clock { font-size: 16px; font-weight: 600; min-width: 130px; }
    .top .group, .debug .group { display: inline-flex; gap: 4px; }
    .top .stat b { color: #fff; }
    .top .warn { color: var(--yellow); }
    .top .notice { flex: 1 1 0; min-width: 90px; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .viewbar { position: absolute; right: 8px; top: 56px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 5px 8px; max-width: calc(100% - 200px); }
    .label { color: var(--muted); margin: 0 2px 0 8px; }
    .left { position: absolute; left: 8px; top: 56px; width: 150px; display: flex; flex-direction: column; gap: 6px; padding: 8px; }
    .left .hint { color: var(--muted); font-size: 12px; }
    .right { position: absolute; right: 8px; top: 100px; width: 280px; display: flex; flex-direction: column; gap: 6px; }
    .right .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; }
    .right .tabbody { max-height: 50vh; overflow: auto; padding: 6px 8px; }
    .right ul { list-style: none; margin: 0; padding: 0; }
    .right li { margin: 2px 0; }
    .right .row { width: 100%; text-align: left; border-left: 4px solid var(--green); }
    .row.t-red { border-left-color: var(--red); }
    .row.t-yellow { border-left-color: var(--yellow); }
    .card { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; min-width: 360px; max-width: 560px; padding: 8px 12px; }
    .cardhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 15px; }
    .cardhead .close { margin-left: auto; }
    .card dl { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; margin: 0; }
    .card dt { color: var(--muted); font-size: 11px; }
    .card dd { margin: 0 0 4px; }
    .badge { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--green); }
    .badge.t-red { background: var(--red); }
    .badge.t-yellow { background: var(--yellow); }
    .muted { color: var(--muted); }
    .debug { position: absolute; right: 8px; bottom: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
    .status { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 15px; max-width: 70%; text-align: center; }
    /* стройка (docs/specs/2026-10-build.md) */
    .banner { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); padding: 5px 12px; color: var(--yellow); max-width: 40%; text-align: center; }
    .left.wide { top: 100px; width: 270px; max-height: calc(100vh - 108px); overflow: hidden; }
    .left.wide > * { flex-shrink: 0; }
    .left.wide > .list { flex-shrink: 1; min-height: 48px; overflow-y: auto; }
    .left .row { display: flex; gap: 4px; align-items: center; }
    .left .row .close { margin-left: auto; }
    .left .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .left .tools button, .left .row button, .left button.wide { text-align: left; }
    .left .spent b { color: #fff; }
    .left .label { color: var(--muted); margin: 2px 0 0; }
    .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .list button { width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left; }
    .list small { color: var(--muted); white-space: nowrap; }
    .list button.on small { color: #0b1a1e; }
    .ghostline { padding: 4px 6px; border-radius: 4px; background: rgba(0,0,0,.25); }
    .ghostline.ok { color: #8fe3b4; }
    .ghostline.bad { color: #ff9b86; }
    .card .state { font-weight: 600; margin: 2px 0 6px; }
    .card .state.ok { color: #8fe3b4; }
    .card .state.bad { color: #ff9b86; }
    .card .problems { margin: -2px 0 6px; padding-left: 18px; color: #ffc2b5; }
    .card .need { display: inline-block; margin-right: 8px; }
    .card .need.ok { color: #8fe3b4; }
    .card .need.bad { color: #ff9b86; }
    .card .post { display: flex; gap: 6px; align-items: center; margin: 1px 0; }
    .card .row { display: flex; gap: 6px; margin-top: 6px; }
    button.small { padding: 1px 6px; font-size: 12px; }
    .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .rlabel { position: absolute; left: 0; top: 0; padding: 2px 7px; border-radius: 4px; background: rgba(22,30,34,.84); border-left: 3px solid var(--green); font-size: 11px; line-height: 1.25; white-space: nowrap; color: var(--text); }
    .rlabel.bad { border-left-color: var(--red); }
    .rlabel b { display: block; font-size: 12px; }
    .rlabel span { color: var(--muted); }
    .rlabel.bad span { color: #ffb4a6; }
    .start { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; width: 420px; }
    .start h2 { margin: 0 0 4px; font-size: 20px; }
    .start button { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 10px 12px; }
    .start button b { font-size: 15px; }
    .start button span { color: var(--muted); }
    /* режим врача (docs/specs/2026-10-doctor-mode.md): окно врача, карта пациента, «Просят посмотреть» */
    .small { font-size: 12px; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .linkish { background: none; border: none; color: var(--accent); padding: 2px 0; text-align: left; }
    .dock { position: absolute; left: 8px; bottom: 10px; width: 330px; max-height: calc(100vh - 330px); min-height: 0; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
    .dock.folded { max-height: none; padding: 4px; }
    .dock .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .dock .row .close { margin-left: auto; }
    .dock .label, .dcard .label { display: block; color: var(--muted); margin: 6px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .dlists ul, #asks ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
    .prow { display: flex; gap: 6px; align-items: center; padding: 2px 4px 2px 6px; border-left: 3px solid var(--green); background: rgba(0,0,0,.18); border-radius: 3px; }
    .prow.t-red, .ask.t-red { border-left-color: var(--red); }
    .prow.t-yellow, .ask.t-yellow { border-left-color: var(--yellow); }
    .prow .who { flex: 1; min-width: 0; }
    .dlevels { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; }
    .dlevels .label { margin: 0 4px 0 0; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 4px; }
    .tiles button { text-align: left; font-size: 12px; }
    .ask { padding: 5px 6px; border-left: 3px solid var(--green); background: rgba(0,0,0,.18); border-radius: 3px; display: flex; flex-direction: column; gap: 3px; }
    .ask .row { display: flex; gap: 4px; flex-wrap: wrap; }
    select, input.search { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; max-width: 100%; }
    input.search { width: 100%; box-sizing: border-box; margin: 4px 0; }
    .dcard { position: absolute; left: 1.5%; right: 1.5%; top: 52px; bottom: 8px; z-index: 5; display: flex; flex-direction: column; padding: 8px 12px; background: rgba(18, 25, 29, 0.97); }
    .dhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .dtitle { font-size: 16px; flex: 1 1 auto; min-width: 0; }
    .dsub { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; margin: 3px 0; }
    button.said { background: none; border: none; padding: 0; font-style: italic; color: #f3e9c8; font-size: 14px; text-align: left; }
    .dtarget { color: #ffd27a; font-weight: 600; }
    .dbanner, .dlikely, .dmeanwhile, .dwait { padding: 4px 8px; border-radius: 4px; margin: 2px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .dbanner { background: rgba(231,180,22,.16); color: #ffe39a; }
    .dlikely { background: rgba(47,181,201,.14); }
    .dmeanwhile { background: rgba(140,170,255,.13); }
    .dwait { background: rgba(76,175,110,.15); }
    .dwait > span { flex: 1; }
    .dcols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.15fr 1.1fr; gap: 10px; margin-top: 6px; }
    .dcol { display: flex; flex-direction: column; min-height: 0; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
    .dcol h3 { margin: 0 0 4px; font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
    .dscroll, .talk { flex: 1; min-height: 0; overflow-y: auto; }
    .talk { display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
    .questions { flex: 0 0 auto; max-height: 42%; overflow-y: auto; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 4px; }
    .qs { display: flex; flex-wrap: wrap; gap: 4px; }
    button.q { border-radius: 14px; border-color: var(--accent); text-align: left; }
    button.q small, .xrow small { color: var(--muted); }
    .pair .doc { align-self: flex-end; margin-left: 18%; background: rgba(47,181,201,.22); border-radius: 10px 10px 2px 10px; padding: 4px 8px; }
    .pair .pt { margin-right: 10%; background: rgba(255,255,255,.06); border-radius: 10px 10px 10px 2px; padding: 4px 8px; margin-top: 3px; }
    .pair.fresh .pt { background: rgba(231,180,22,.18); }
    .answer { display: flex; flex-wrap: wrap; gap: 2px 8px; }
    button.line { background: none; border: none; padding: 0; text-align: left; color: var(--muted); font-size: 12px; }
    button.line.yes { color: #fff; font-weight: 600; }
    button.line.more { color: var(--accent); }
    .dtabs { display: flex; gap: 4px; margin-bottom: 4px; }
    .dtabs .new, .xhead .new { color: #0b1a1e; background: var(--yellow); border-radius: 8px; padding: 0 5px; font-size: 11px; margin-left: 4px; }
    .dsec { margin-bottom: 4px; }
    .dsechead { width: 100%; display: flex; justify-content: space-between; gap: 8px; background: rgba(0,0,0,.2); text-align: left; }
    .dsechead small { color: var(--muted); }
    .dsecbody { display: flex; flex-direction: column; gap: 2px; padding: 3px 0 3px 6px; }
    .xrow { display: flex; gap: 6px; align-items: center; width: 100%; text-align: left; padding: 2px 6px; box-sizing: border-box; }
    label.xrow { cursor: pointer; border-radius: 4px; }
    label.xrow:hover { background: rgba(255,255,255,.05); }
    .xrow > span { flex: 1; min-width: 0; }
    .xrow.off { opacity: .5; }
    .xrow.on { border-color: var(--accent); }
    .xrow.done { flex-direction: column; align-items: stretch; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
    .xrow.fresh, .kgroup.fresh { background: rgba(231,180,22,.12); border-color: rgba(231,180,22,.5); }
    .xhead { font-weight: 600; color: var(--muted); font-size: 12px; }
    .stamp { margin-left: 8px; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; font-family: ui-monospace, Consolas, monospace; }
    .kgroup { border: 1px solid transparent; border-radius: 4px; padding: 3px 6px; margin-bottom: 4px; }
    .xrow > .info, .q > .info { flex: 0 0 16px; }
    .hint button, .dtabs button { white-space: nowrap; }
    .info { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font-size: 11px; cursor: help; flex: 0 0 auto; }
    .sendbar, .finishbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 5px; margin-top: 4px; }
    .sendbar { position: sticky; bottom: 0; background: rgba(18,25,29,.97); }
    .hint, .hyphead { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
    .hyphead { width: 100%; text-align: left; }
    .hyphead small { color: var(--muted); }
    .hyp.open { border: 1px solid var(--line); border-radius: 4px; padding: 3px; }
    .hypbody p, .dcol p { margin: 2px 0; }
    .hypbody .row, .dcol .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 3px 0; }
    small.warn { color: #ffb4a6; }
    #dx-select { width: 100%; }
    .verdict { font-size: 20px; font-weight: 700; }
    .verdict.correct { color: #8fe3b4; }
    .verdict.partly { color: #ffd27a; }
    .verdict.wrong { color: #ff9b86; }
    .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .grade { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,.22); border-radius: 4px; padding: 3px; }
    .grade.total { background: rgba(47,181,201,.2); }
    .grade b { font-size: 20px; }
    .grade small { color: var(--muted); font-size: 11px; text-align: center; }
    .ga { color: #8fe3b4; } .gb { color: #7fc3ff; } .gc { color: #ffd27a; } .gd { color: #ff9b86; }
    #card-said.ok { color: #8fe3b4; }
    #card-said.bad { color: #ff9b86; }
    .term { position: absolute; right: 24px; top: 70px; width: 340px; padding: 10px 12px; z-index: 6; background: rgba(28,38,44,.98); }
    .term p { margin: 4px 0; }
    /* касса, планёрка, обход (docs/specs/2026-10-economy.md) */
    .top .stat .ok, .msec .ok, .dround .ok, .dlists .ok { color: #8fe3b4; }
    .top .stat .bad, .msec .bad, .dround .bad, .dlists .bad { color: #ff9b86; }
    .top .stat.bad b { color: #ff9b86; }
    .meeting { position: absolute; left: 50%; top: 52px; bottom: 10px; transform: translateX(-50%); width: min(820px, 96%); z-index: 6; display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; background: rgba(18, 25, 29, 0.97); }
    .mhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 16px; }
    .mhead b { flex: 1 1 auto; }
    .mhead label { font-size: 12px; color: var(--muted); }
    .mbody { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; align-content: start; }
    #reports .mbody { display: block; overflow: visible; }
    .msec h3 { margin: 4px 0 2px; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
    .msec p { margin: 2px 0; }
    .msec ul { list-style: none; margin: 0; padding: 0 0 0 6px; }
    .msec li { margin: 1px 0; }
    #meet-tip { grid-column: 1 / -1; background: rgba(47,181,201,.12); border-radius: 4px; padding: 2px 8px 4px; }
    .hours { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .hours .label { margin-left: 0; }
    .prow.ward { align-items: flex-start; }
    .prow.worse { background: rgba(216,57,43,.16); }
    .dround { border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; margin: 4px 0; display: flex; flex-direction: column; gap: 3px; max-height: 42%; overflow-y: auto; background: rgba(76,175,110,.07); }
    .dround .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dround-tx { display: flex; flex-direction: column; gap: 1px; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="ui"></div>
  <script src="./app.js"></script>
</body>
</html>
