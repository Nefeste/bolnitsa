# Испытание «Только по показаниям» (spec docs/specs/2026-11-challenges.md; геймдизайн §9): смена врача в поликлинике, 08:00–20:00;
# страховая проверяет каждый ваш приём — обследование, назначенное без показаний и не подтверждающее диагноз, не оплачивает
# (экспертиза ОМС, `caseIncome`). Назначать не запрещено; больше двух таких за смену — не пройдено. Разумный врач, что
# назначает весь план сразу, набирает их 3–12, а назначающий только показанное сейчас — 0–2 (проба `bun
# tools/bench/challenges.ts --only indicated`). Итог — итог смены врача. Слова — предложение агента на одобрение владельца.
