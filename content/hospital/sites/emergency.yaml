# Амбулатория с приёмным — начало сценария 3 «Хирургия» (spec docs/specs/2026-11-scenario-3.md, «Начало и больница»;
# решение владельца #209, вариант 1): ваша больница, какой её строили в сценарии 2, — амбулатория сценария 2 (`base`) и её
# восточное крыло на тех же местах, где его ставит разумный план симулятора экономики (tools/sim/economy.ts, `WING` и кабинет
# хирурга): смотровая приёмного у входа скорой, две палаты и рентген, кабинет хирурга с амбулаторным хирургом и вторая
# ординаторская, две скамьи у его двери. Корпус шире на 20 клеток к востоку — свободная земля под операционную и палату для
# оперированных; вход скорой — в новой восточной стене.
id: site.emergency
base: site.ambulatory
wider: 20
rooms:
  # крыло приёмного сценария 2: смотровая, палаты, рентген
  - { type: room.emergency, size: M, x: 42, y: 27, rot: 2 }
  - { type: room.ward, size: M, x: 30, y: 6, rot: 0 }
  - { type: room.ward, size: M, x: 38, y: 6, rot: 0 }
  - { type: room.xray, size: M, x: 32, y: 16, rot: 2 }
  # кабинет хирурга (часть 3 сценария 2): кабинет врача с амбулаторным хирургом; вторая ординаторская
  - { type: room.office, size: M, x: 46, y: 6, rot: 0, as: role.surgeon_clinic }
  - { type: room.staff, size: S, x: 41, y: 16, rot: 2 }
benches:
  - [50, 13]
  - [51, 13]
