# Амбулатория сценария 2 «Приёмное» (spec docs/specs/2026-11-scenario-2.md, «Начало и больница»; решение владельца #197,
# вариант 1): амбулатория, какой её строили в сценарии 1, — по правилам «Больницы как настоящей» (spec
# docs/specs/2026-10-real-hospital.md, СП 158.13330.2014). Западная половина здания: регистратура и доврачебный кабинет — у
# главного входа, по обе стороны вестибюля; зал ожидания — напротив дверей двух кабинетов врача; процедурная, лаборатория и
# ЭКГ — между входом и кабинетами; ординаторская — в конце ряда, вне пути больных; санузел — у кабинетов и зала. Первый
# кабинет — ваш, второй — нанятого терапевта: ночью врач нужен и ему. Восточная половина у входа скорой свободна: там
# строят смотровую приёмного, рентген и палаты.
id: site.ambulatory
rooms:
  # север, дверью вниз: два кабинета врача, санузел, ординаторская
  - { type: room.office, size: M, x: 6, y: 6, rot: 0, mine: true }
  - { type: room.office, size: M, x: 13, y: 6, rot: 0 }
  - { type: room.toilet, size: S, x: 20, y: 6, rot: 0 }
  - { type: room.staff, size: S, x: 25, y: 6, rot: 0 }
  # середина, дверью вверх: зал ожидания напротив кабинетов, процедурная, лаборатория, ЭКГ
  - { type: room.waiting, size: M, x: 8, y: 16, rot: 2 }
  - { type: room.procedure, size: S, x: 17, y: 16, rot: 2 }
  - { type: room.lab, size: S, x: 22, y: 16, rot: 2 }
  - { type: room.ecg, size: S, x: 27, y: 16, rot: 2 }
  # юг, у главного входа, дверью вверх: регистратура и доврачебный кабинет
  - { type: room.reception, size: S, x: 22, y: 26, rot: 2 }
  - { type: room.triage, size: S, x: 31, y: 26, rot: 2 }
# скамьи — по паре у двери каждого кабинета врача (spec docs/specs/2026-10-door-benches.md)
benches:
  - [10, 13]
  - [11, 13]
  - [17, 13]
  - [18, 13]
