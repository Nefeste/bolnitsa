# Поликлиника по нормам проектирования (spec docs/specs/2026-10-real-hospital.md): готовые помещения в пустом здании игры,
# правила — из СП 158.13330.2014 «Здания и помещения медицинских организаций», без чертежей конкретного здания. Регистратура
# и доврачебный кабинет — у главного входа, по обе стороны вестибюля. Залы ожидания — «карманы» напротив дверей кабинетов
# врачей (п. 6.9.1.11, табл. Б.1): зал M на два кабинета — десять мест, не меньше пяти на кабинет. Процедурная, лаборатория
# и ЭКГ — между входом и кабинетами. Ординаторская на четыре места — в конце ряда, вне пути больных; санузел — у залов.
# Первый кабинет — ваш. Остальная площадь — под стройку игрока
id: site.polyclinic
rooms:
  # север: кабинеты терапевтов дверью вниз, между ними санузел и лаборатория, ординаторская — в конце ряда
  - { type: room.office, size: M, x: 6, y: 6, rot: 0, mine: true }
  - { type: room.office, size: M, x: 13, y: 6, rot: 0 }
  - { type: room.toilet, size: S, x: 20, y: 6, rot: 0 }
  - { type: room.lab, size: S, x: 25, y: 6, rot: 0 }
  - { type: room.office, size: M, x: 30, y: 6, rot: 0 }
  - { type: room.office, size: M, x: 37, y: 6, rot: 0 }
  - { type: room.staff, size: M, x: 44, y: 6, rot: 0 }
  # середина, дверью вверх: зал ожидания напротив первых двух кабинетов, процедурная, зал напротив двух других, ЭКГ
  - { type: room.waiting, size: M, x: 8, y: 16, rot: 2 }
  - { type: room.procedure, size: S, x: 22, y: 16, rot: 2 }
  - { type: room.waiting, size: M, x: 32, y: 16, rot: 2 }
  - { type: room.ecg, size: S, x: 40, y: 16, rot: 2 }
  # юг, у главного входа, дверью вверх: регистратура и доврачебный кабинет
  - { type: room.reception, size: S, x: 22, y: 26, rot: 2 }
  - { type: room.triage, size: S, x: 32, y: 26, rot: 2 }
