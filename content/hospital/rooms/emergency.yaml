id: room.emergency
name: { ru: "Смотровая приёмного" }
gen: { ru: "смотровой приёмного" }
# санитар (spec docs/specs/2026-10-orderlies.md, решения владельца 24.10.2026, #88–#89) — по одному на смену; работает
# и без него: лежачих тогда везёт медсестра
staff: [role.nurse, role.orderly]
# отделение по виду помещения (spec docs/specs/2026-10-departments.md)
department: dept.emergency
# работает и ночью (spec docs/specs/2026-10-staff-shifts.md): готовая больница — и с ночной сменой
night: true
emergency: true
# приёмное принимает всех: работает смотровая — приходят и хирургические больные (часть 30), и
# с травмой (часть 32)
admits: [dept.surgery, dept.trauma]
sizes:
  - id: S
    w: 7
    h: 6
    cost: 26000
    upkeep: 180
    door: { x: 3, width: 2 }
    objects:
      - [bed, 2, 2]
      - [cabinet, 4, 2]
      - [sink, 5, 2]
    # монитор с дефибриллятором — у койки (часть 37)
    slots: [[3, 2]]
    staff: { role.nurse: [4, 3], role.orderly: [2, 4] }
  - id: M
    w: 9
    h: 6
    cost: 38000
    upkeep: 260
    door: { x: 4, width: 2 }
    objects:
      - [bed, 1, 2]
      - [cabinet, 3, 2]
      - [bed, 5, 2]
      - [sink, 7, 2]
    slots: [[4, 2]]
    staff: { role.nurse: [4, 3], role.orderly: [3, 4] }
  - id: L
    w: 11
    h: 6
    cost: 50000
    upkeep: 340
    door: { x: 5, width: 2 }
    objects:
      - [bed, 1, 2]
      - [cabinet, 3, 2]
      - [bed, 5, 2]
      - [cabinet, 7, 2]
      - [bed, 8, 2]
      - [sink, 9, 3]
    slots: [[4, 2]]
    staff: { role.nurse: [4, 3], role.orderly: [4, 4] }
texts:
  hint: { ru: "Сюда скорая привозит пациентов на каталке — мимо регистратуры и очереди. Сортируют по листу передачи, по шкале: «красного» врач смотрит первым. Мест столько, сколько коек; все заняты — ждут на каталке у входа. ЭКГ с монитором снимают у постели. Лежачего везёт санитар, нет санитара — медсестра, если больной срочный." }
