# Поток от больницы (spec docs/specs/2026-10-economy.md; решение владельца 17.10.2026 — ответ на вопрос 2 части 5а) — своё
# «Больницы», поток для ПК: сколько приходят сами и сколько машин везёт скорая — от того, что в больнице работает, и от
# репутации; уровень больницы (геймдизайн §4) — в 1.0. Числа игровые — гипотезы; правка числа — с прогоном симулятора
# экономики (`bun tools/sim/economy.ts`) в описании коммита.
#
# walkIn — сами: человек в час на каждый работающий кабинет нанятого врача, который принимает пришедших сам (терапевт), в
#   среднем за час приёма по умолчанию; по часам — форма `walk` из day.yaml. Нет таких врачей — ваш кабинет за один. Нанятый
#   терапевт навыка 3 успевает около трёх в час: при 2,5 утренний пик даёт очередь, но почти никто не уходит.
# booked — по записи (spec docs/specs/2026-10-specialists.md): человек в час к каждому работающему специалисту, в среднем за
#   час приёма по умолчанию, по той же форме `walk` и с той же поправкой на репутацию; болезни — из его профиля, которые
#   больница принимает. При 2 специалист навыка 3 принимает 21–26 в сутки, из записанных уходят около 10 % (проба
#   спецификации); при 2,5 — уходят до 18 %.
# ambulance — скорая: машин в сутки на каждое место работающей смотровой приёмного; по часам — форма `ambulance`.
# reputation — поток сами при репутации 0 и 100 меньше и больше на столько процентов (геймдизайн §8: ±30 %), между — по
#   прямой; на скорую не влияет.
# hall — сидя или стоя по своему залу (spec docs/specs/2026-10-own-hall.md; решение владельца 18.10.2026): свой зал — зона
#   ожидания не дальше стольких метров от двери кабинета врача, к которому записан пришедший; в нём есть место — сидит, нет
#   такого зала или он полон — стоит в коридоре у двери кабинета и ждать готов вдвое меньше. Число — то же, что в правилах
#   планировки (геймдизайн §9: зал не дальше 10 м от двери кабинета).
# targets — ориентиры геймдизайна §5: больница с этими кабинетами и местами смотровой (сколько их — гипотеза) при репутации
#   50 и часах приёма по умолчанию получает столько в сутки — сами и скорая вместе (`day`) и скорая (`ambulance`). Проверяет
#   сборка базы.
walkIn: 2.5
booked: 2
ambulance: 4
reputation: 30
hall: 10
targets:
  - { name: амбулатория, offices: 1, bays: 0, day: [25, 40], ambulance: [0, 0] }
  - { name: районная, offices: 3, bays: 3, day: [60, 120], ambulance: [8, 15] }
  - { name: большая, offices: 8, bays: 9, day: [200, 300], ambulance: [30, 50] }
