# Касса больницы ПК (spec docs/specs/2026-10-economy.md) — своё «Больницы». Тарифы ОМС, ДМС и платных, проверка страховой,
# зарплаты, содержание, расходники, койко-дни, ремонт, процент на долг, репутация и стартовые бюджеты — из «Анамнеза»
# (economy.yaml, как есть); здесь — то, чего в «Анамнезе» нет. Числа игровые — гипотезы; правка числа — с прогоном
# симулятора экономики (`bun tools/sim/economy.ts`) в описании коммита.
#
# overdraft — до какого минуса касса оплачивает стройку, ₽: ниже стройка ждёт денег; зарплаты, содержание, койко-дни и
#   процент списываются всегда, и касса может уйти ниже предела сама.
# loan — кредит банка, когда на планёрке касса ниже предела (геймдизайн §8: «в песочнице банк предлагает кредит»): сумма —
#   до нуля кассы, вверх до `step`, ₽; вернуть за `days` суток равными долями на планёрках; сверх суммы — `fee` % (дешевле
#   процента на долг: 0,5 % в сутки — 15 % за 30 суток).
overdraft: 300000
loan: { step: 100000, days: 30, fee: 10 }
