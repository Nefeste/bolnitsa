# Техник (spec docs/specs/2026-11-technicians.md; геймдизайн §3, «Поломки», и §7: «техник — чинит и обслуживает аппараты»):
# место — в ординаторской, как у санитара в смотровой, — помещение работает и без него. Чинит сломанный аппарат за часы по
# навыку (`staff.repair` в economy.yaml), в свободное время обходит аппараты — дольше всех без обслуживания первым. Зарплата —
# игровая, как у санитара и лаборанта; проверяется симулятором экономики. Слова — предложение агента на одобрение владельца.
id: role.technician
name: { ru: "Техник", en: "Technician" }
gen: { ru: "техника" }
salary: [1200, 1900]
optional: true
# в готовой больнице техника нет: нанять его или платить сервису — выбор игрока
ready: false
texts:
  hint: { ru: "Чинит аппараты обследований, когда они ломаются в работе, — за часы, тем быстрее, чем выше навык; в свободное время обходит их, и они ломаются реже. Без техника сломанное чинит сервис — к утру и дороже." }
