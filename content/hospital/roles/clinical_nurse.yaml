# Клиническая медсестра (spec docs/specs/2026-10-staff-motion.md, часть 2б; решения владельца 31.10.2026: #181, вариант 1, —
# решает врач; #183, вариант 2, — встаёт на место медсестры палаты днём): опытная медсестра с ещё одной обязанностью. Днём в
# палате, ПИТ, реанимации или боксе делает всё, что медсестра этого помещения, и в 08:30 обходит все его койки, отмечая, кому
# нужно решение врача; врач идёт только к отмеченным. Решает по-прежнему врач. Нанимают вместо медсестры — разница в
# зарплате и есть цена; ночью — обычная медсестра. Зарплата — между медсестрой и врачом (гипотеза агента).
id: role.clinical_nurse
name: { ru: "Клиническая медсестра" }
gen: { ru: "клинической медсестры" }
salary: [2000, 3200]
# на место медсестры — только в помещениях с койками
stands: role.nurse
in: [room.ward, room.icu, room.ricu, room.box]
# только днём: обход — в 08:30, ночью на месте медсестры — обычная медсестра
day: true
texts:
  hint: { ru: "Медсестра, которая утром ещё и обходит все койки помещения и отмечает, кому нужно решение врача: врач идёт только к ним и раньше возвращается к приёму. Решает по-прежнему врач. Встаёт на место медсестры днём, дороже её." }
