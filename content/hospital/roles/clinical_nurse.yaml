# Клиническая медсестра (spec docs/specs/2026-10-staff-motion.md, часть 2б; решение владельца 31.10.2026, #181, вариант 1):
# в палате, ПИТ, реанимации или боксе в 08:30 обходит все койки своего помещения и отмечает, кому нужно решение врача;
# врач идёт только к отмеченным — утром он дольше принимает. Решает по-прежнему врач. Помещение работает и без неё
# (`optional`). Зарплата — между медсестрой и врачом (гипотеза агента).
id: role.clinical_nurse
name: { ru: "Клиническая медсестра" }
gen: { ru: "клинической медсестры" }
salary: [2000, 3200]
optional: true
# готовая палата «С персоналом» её не нанимает: это выбор игрока с ценой
ready: false
# только днём: обход — в 08:30, ночью ей в палате делать нечего
day: true
texts:
  hint: { ru: "Утром обходит все койки своей палаты и отмечает, кому нужно решение врача: врач идёт только к ним и раньше возвращается к приёму. Решает по-прежнему врач." }
