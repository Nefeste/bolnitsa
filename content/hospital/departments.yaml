# Отделения больницы ПК (spec docs/specs/2026-10-departments.md, часть 1; геймдизайн §4; решения владельца #140, #142) — по
# порядку таблицы §4, так их показывает окно. У помещения отделение — по тем, кто в нём работает (`department` должности),
# иначе — по виду помещения (`department` помещения); палату и кабинет (`paint` помещения) инструмент «Отделение»
# переводит в другое — в отделение с `paint`. У болезни отделение — из медицинской базы; `takes` — чьих больных отделение
# берёт ещё: травму лечит хирургия (§4). Диагностика (служба) и общие помещения — без отделения.
departments:
  - id: dept.emergency
    name: { ru: "Приёмное отделение" }
  - id: dept.therapy
    name: { ru: "Терапия" }
    paint: true
  - id: dept.surgery
    name: { ru: "Хирургия" }
    paint: true
    takes: [dept.trauma]
  - id: dept.neurology
    name: { ru: "Неврология" }
    paint: true
  - id: dept.infectious
    name: { ru: "Инфекционное отделение" }
    paint: true
  - id: dept.icu
    name: { ru: "Реанимация" }
