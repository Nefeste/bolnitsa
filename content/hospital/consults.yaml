# «Просят посмотреть» (spec docs/specs/2026-10-consults.md) — только «Больница», поток для ПК: нанятый врач после своих
# обследований выбрал диагноз, но не уверен и зовёт вас. Числа игровые — гипотезы, подобраны пробой
# `bun tools/bench/consults.ts --probe`; правка числа — с её отчётом и замером `bun tools/bench/consults.ts` в описании
# коммита.
#
# unsure — по навыку 1–5: просит, если уверенность в его диагнозе вместе с болезнями той же группы ниже, %. Слабый
#   сомневается чаще: порог не растёт с навыком (это проверяет сборка базы).
# close — просит, если вторая по вероятности группа болезней не меньше этой доли первой, %: «две гипотезы рядом».
# wait — сколько игровых минут ждёт ответа; не ответили — решает сам.
# long — сколько игровых часов с первого вызова врач ведёт больного без диагноза, прежде чем попросить посмотреть с
#   причиной «долго» (решение владельца 17.10.2026 — ответ на вопрос 7 части 5а; spec docs/specs/2026-10-economy.md); уже
#   просил о нём — после этого срока решает тем, что знает.
unsure: [70, 68, 68, 56, 44]
close: 75
wait: 30
long: 4
