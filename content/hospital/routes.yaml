# Маршруты для срочного (spec docs/specs/2026-11-scenario-4.md, решения агента 4–5; решение владельца #219, вариант 1): что
# делает медсестра смотровой приёмного до врача, когда игрок включил маршрут в карточке смотровой. Кому — по жалобам срока при
# поступлении (`target`), что — обследование (`exam`) из его списка. Маршрут стоит денег: обследование делают и тем, кому врач
# его не назначил бы. Слова — предложение агента на одобрение владельца.
routes:
  - id: route.ecg_chest_pain
    target: target.ecg_chest_pain
    exam: exam.ecg
    name: { ru: "Боль в груди — ЭКГ у постели сразу", en: "Chest pain — bedside ECG at once" }
  - id: route.stroke_ct
    target: target.stroke_ct
    exam: exam.ct_head
    name: { ru: "Признаки инсульта — КТ сразу", en: "Stroke signs — CT at once" }
