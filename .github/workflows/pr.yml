# Быстрые проверки на каждый PR в main (ADR студии 0019): сборка и валидатор медицинской базы, типы, тесты движка —
# те же команды, что в AGENTS.md («Commands»). Без сборки игры: её собирает build.yml по тегу версии. Проверка
# обязательна для слияния (ADR студии 0018) и отвечает на каждом PR, и на документах тоже, — поэтому без paths-ignore:
# иначе она повисла бы «ожидающей». Бенчмарк (tools/bench) — не здесь: его гоняют у себя, когда меняют движок. Черновик
# PR не проверяется — задание пропускается внутри, и проверка уходит, когда PR готов к ревью. Образец — pr.yml «Анамнеза».
name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Проверки PR
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm ci
      # бандл базы не хранится в репозитории (ADR 0007 «Анамнеза»): типы и тесты читают собранный
      - name: Медицинская база — сборка и валидатор
        run: bun tools/content/build.ts
      - name: Типы
        run: npx tsc --noEmit
      - name: Тесты
        run: bun test tools/test
